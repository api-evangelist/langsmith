openapi: 3.2.0
info:
  title: LangSmith Directories API
  description: 'The LangSmith API is used to programmatically create and manage LangSmith resources.


    ## Host

    https://api.smith.langchain.com


    ## Authentication

    To authenticate with the LangSmith API, set the `X-Api-Key` header

    to a valid LangSmith API key.'
  version: 0.1.0
servers:
- url: /
tags:
- name: Directories
paths:
  /v1/platform/hub/repos/{owner}/{repo}/directories:
    get:
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      description: Resolves the flattened file tree for an agent or skill repository at a specific commit, tag, or latest.
      tags:
      - Directories
      summary: Get directory contents
      parameters:
      - description: Repository owner handle or '-' for current tenant
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: Repository handle
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: Commit hash/tag to resolve (defaults to latest)
        name: commit
        in: query
        schema:
          type: string
          title: Commit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/directories.GetDirectoryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      operationId: getV1PlatformHubReposByOwnerByRepoDirectories
      x-operation-id-source: derived
    delete:
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      description: Deletes an agent or skill repository and its owned child file repositories.
      tags:
      - Directories
      summary: Delete directory repository
      parameters:
      - description: Repository owner handle or '-' for current tenant
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: Repository handle
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      operationId: deleteV1PlatformHubReposByOwnerByRepoDirectories
      x-operation-id-source: derived
  /v1/platform/hub/repos/{owner}/{repo}/directories/commits:
    post:
      security:
      - API Key: []
      - Tenant ID: []
      - Bearer Auth: []
      description: Creates a new directory commit for an agent or skill repository by applying file/link create, update, and delete operations.
      tags:
      - Directories
      summary: Create directory commit
      parameters:
      - description: Repository owner handle or '-' for current tenant
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: Repository handle
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/directories.CommitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/directories.CreateDirectoryCommitRequest'
      operationId: postV1PlatformHubReposByOwnerByRepoDirectoriesCommits
      x-operation-id-source: derived
components:
  schemas:
    directories.GetDirectoryResponse:
      type: object
      properties:
        commit_hash:
          type: string
        commit_id:
          type: string
        files:
          type: object
          additionalProperties: {}
    directories.CommitInfo:
      type: object
      properties:
        commit_hash:
          type: string
        created_at:
          type: string
        id:
          type: string
    directories.CreateDirectoryCommitRequest:
      type: object
      properties:
        files:
          description: Files maps path to an Entry (object = create/update/link, null = delete/unlink).
          type: object
          additionalProperties: {}
        parent_commit:
          type: string
    directories.CommitResponse:
      type: object
      properties:
        commit:
          $ref: '#/components/schemas/directories.CommitInfo'
  securitySchemes:
    API_Key:
      type: apiKey
      in: header
      name: X-API-Key
    Tenant_ID:
      type: apiKey
      in: header
      name: X-Tenant-Id
    Bearer_Auth:
      type: http
      description: Bearer tokens are used to authenticate from the UI. Must also specify x-tenant-id or x-organization-id (for org scoped apis).
      scheme: bearer
    Organization_ID:
      type: apiKey
      in: header
      name: X-Organization-Id
